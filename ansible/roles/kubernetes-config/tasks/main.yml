- name: Get AWS account ID
  shell: aws sts get-caller-identity --query Account --output text
  register: aws_account_result
  delegate_to: localhost

- name: Set account ID fact
  set_fact:
    ansible_aws_account_id: "{{ aws_account_result.stdout }}"

- name: Ensure kubectl is configured
  shell: |
    aws eks --region {{ aws_region }} update-kubeconfig --name {{ cluster_name }}
  delegate_to: localhost
  
- name: Verify cluster connectivity
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: node_info
  
- name: Create RBAC for platform services
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: platform-admin
      rules:
        - apiGroups: [""]
          resources: ["pods", "services", "configmaps", "secrets", "namespaces"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["ingresses", "networkpolicies"]
          verbs: ["get", "list", "create", "update", "patch", "delete"]
          
- name: Create service account for platform API
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: platform-api
        namespace: platform-system
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::{{ ansible_aws_account_id }}:role/devplatform-dev-platform-api-role"
          
- name: Bind platform service account to cluster role
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: platform-api-binding
      subjects:
        - kind: ServiceAccount
          name: platform-api
          namespace: platform-system
      roleRef:
        kind: ClusterRole
        name: platform-admin
        apiGroup: rbac.authorization.k8s.io
        
- name: Configure storage classes
  kubernetes.core.k8s:
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: fast-ssd
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
      provisioner: ebs.csi.aws.com
      volumeBindingMode: WaitForFirstConsumer
      parameters:
        type: gp3
        iops: "3000"
        throughput: "125"

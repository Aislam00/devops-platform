app:
  title: DevPlatform Portal
  baseUrl: https://portal.iasolutions.co.uk

organization:
  name: Platform Engineering

backend:
  baseUrl: https://portal.iasolutions.co.uk
  listen:
    port: 7007
    host: 0.0.0.0
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://portal.iasolutions.co.uk
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      ssl:
        require: true
        rejectUnauthorized: true
        ca:
          $file: /etc/ssl/certs/rds-combined-ca-bundle.pem

proxy:
  endpoints:
    '/platform-api':
      target: 'https://api.iasolutions.co.uk'
      headers:
        Accept: 'application/json'
        Content-Type: 'application/json'

integrations:
  github:
    - host: github.com

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Template]
  locations:
    - type: file
      target: ./examples/platform-components.yaml
    - type: file
      target: ./examples/templates.yaml
      rules:
        - allow: [Template]
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

scaffolder:
  defaultAuthor:
    name: DevPlatform
    email: platform@iasolutions.co.uk
  defaultCommitMessage: 'Initial commit'

kubernetes:
  serviceLocatorMethod:
    type: 'multiTenant'
  clusterLocatorMethods:
    - type: 'config'
      clusters:
        - url: ${EKS_CLUSTER_ENDPOINT}
          name: devplatform-dev
          authProvider: 'aws'
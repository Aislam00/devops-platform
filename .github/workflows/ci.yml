name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: eu-west-2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: platform-api/go.sum

    - name: Run tests
      run: |
        cd platform-api
        go mod tidy
        go test -v -race -coverprofile=coverage.out ./...

    - name: Build binary
      run: |
        cd platform-api
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o platform-api cmd/server/main.go

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Terraform Format Check
      run: |
        find terraform -name "*.tf" -exec terraform fmt -check {} \;

    - name: Terraform Validate Backend
      run: |
        cd terraform/backend
        terraform init -backend=false
        terraform validate

    - name: Terraform Validate Environments
      run: |
        cd terraform/environments/dev
        terraform init -backend=false
        terraform validate

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get account ID and terraform outputs
      id: account
      run: |
        echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT
        cd terraform/environments/dev
        terraform init -backend-config=backend.conf
        echo "api_repo=$(terraform output -raw ecr_api_repository)" >> $GITHUB_OUTPUT
        echo "portal_repo=$(terraform output -raw ecr_portal_repository)" >> $GITHUB_OUTPUT

    - name: Build & Push platform-api
      run: |
        cd platform-api
        docker build --platform linux/amd64 -t platform-api .
        docker tag platform-api:latest ${{ steps.account.outputs.api_repo }}:latest
        docker tag platform-api:latest ${{ steps.account.outputs.api_repo }}:${{ github.sha }}
        docker push ${{ steps.account.outputs.api_repo }}:latest
        docker push ${{ steps.account.outputs.api_repo }}:${{ github.sha }}

    - name: Build & Push devplatform-portal
      run: |
        cd backstage/portal
        docker build --platform linux/amd64 -t devplatform-portal .
        docker tag devplatform-portal:latest ${{ steps.account.outputs.portal_repo }}:latest
        docker tag devplatform-portal:latest ${{ steps.account.outputs.portal_repo }}:${{ github.sha }}
        docker push ${{ steps.account.outputs.portal_repo }}:latest
        docker push ${{ steps.account.outputs.portal_repo }}:${{ github.sha }}
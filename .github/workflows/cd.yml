name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - infrastructure
        - platform-api
        - backstage

env:
  AWS_REGION: eu-west-2
  CLUSTER_NAME: devplatform-dev

jobs:
  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.component == 'infrastructure' || github.event.inputs.component == 'all' || github.event.inputs.component == ''
    outputs:
      cluster-name: ${{ steps.terraform.outputs.cluster-name }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy Infrastructure
      working-directory: terraform/environments/dev
      run: |
        terraform init
        terraform plan -out=tfplan
        terraform apply tfplan

    - name: Get cluster name
      id: terraform
      working-directory: terraform/environments/dev
      run: |
        echo "cluster-name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: [infrastructure]
    if: always() && !failure() && github.ref == 'refs/heads/main' && (github.event.inputs.component == 'platform-api' || github.event.inputs.component == 'all' || github.event.inputs.component == '')
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.28.0

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Deploy API
      run: |
        kubectl apply -f k8s/platform-api.yaml
        kubectl rollout status deployment/platform-api -n platform-api --timeout=300s

  deploy-portal:
    name: Deploy Portal
    runs-on: ubuntu-latest
    needs: [infrastructure, deploy-api]
    if: always() && !failure() && github.ref == 'refs/heads/main' && (github.event.inputs.component == 'backstage' || github.event.inputs.component == 'all' || github.event.inputs.component == '')
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.28.0

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Deploy Portal
      run: |
        kubectl apply -f k8s/backstage.yaml
        kubectl rollout status deployment/backstage -n backstage --timeout=300s

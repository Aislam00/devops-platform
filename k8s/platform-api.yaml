apiVersion: v1
kind: Namespace
metadata:
  name: platform-api
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: platform-api
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: platform-api-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-api-secrets
  namespace: platform-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: platform-api-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: devplatform-dev-jwt-secret-20250830210126642500000004
  - extract:
      key: devplatform-dev-database-connection-20250830210126428400000001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api-sa
  namespace: platform-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::475641479654:role/devplatform-dev-platform-api-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      serviceAccountName: platform-api-sa
      tolerations:
      - key: platform-services
        value: "true"
        effect: NoSchedule
        operator: Equal
      containers:
      - name: platform-api
        image: 475641479654.dkr.ecr.eu-west-2.amazonaws.com/devplatform-apiatest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: platform-api-secrets
              key: JWT_SECRET
        - name: AWS_REGION
          value: "eu-west-2"
        - name: ENVIRONMENT
          value: "production"
        - name: CLUSTER_NAME
          value: "devplatform-dev"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api-service
  namespace: platform-api
spec:
  selector:
    app: platform-api
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-api-ingress
  namespace: platform-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-2:475641479654:certificate/2ffd316a-fda0-43c8-94e2-5c20c8245a91
spec:
  ingressClassName: alb
  rules:
  - host: api.iasolutions.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: platform-api-service
            port:
              number: 80
